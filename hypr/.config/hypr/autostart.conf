# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Auto-position JetBrains Toolbox under waybar on the right edge of whichever monitor it opens on
exec-once = ~/.local/bin/jetbrains-toolbox-positioner

# Omarchy always starts hypridle: kill it so nothing locks on idle.
exec-once = sleep 3 && pkill -x hypridle && pkill -RTMIN+9 waybar
