# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 2
    gaps_out = 6
    border_size = 2

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    active_opacity = 1.0 
    inactive_opacity = 1.0 
    dim_inactive = 0
    blur {
        enabled = false
        size = 0
        passes = 0
    }
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

opacity = 1.0

# Override default omarchy window opacity (defaults are 0.97 active / 0.9 inactive)
# Uses "override" so rules multiply to exactly 1.0 instead of stacking
windowrule = opacity 1.0 override 1.0 override, match:tag default-opacity
windowrule = opacity 1.0 override 1.0 override, match:tag terminal
windowrule = opacity 1.0 override 1.0 override, match:tag firefox-based-browser
windowrule = opacity 1.0 override 1.0 override, match:tag chromium-based-browser