[global]
   workgroup = WORKGROUP
   server string = MPD Dev Share
   security = user
   passdb backend = tdbsam
   map to guest = never
   server min protocol = SMB2
   client min protocol = SMB2
   # Bind only to loopback and the libvirt bridge — share is for the VM, not the LAN
   interfaces = lo virbr0
   bind interfaces only = yes
   # No printer sharing
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # Quieter logs
   log file = /var/log/samba/log.%m
   max log size = 1000
   log level = 1

   smb3 unix extensions = no
   smb1 unix extensions = no

[mpd-share]
   path = /home/emmanuel/mpd-share
   valid users = emmanuel
   writable = yes
   create mask = 0664
   directory mask = 0775
   # veto oplock files = /  disables oplocks for everything in the share.
   # Load-bearing for VS / SSDT / Jet-engine (.dbmdl) compatibility.
   veto oplock files = /
   acl allow execute always = yes
