onboarding = false

[theme]
name = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

# Mirrors ~/.config/tmux/tmux.conf. A herdr tab is a tmux window, a herdr workspace is a tmux session.
[keys]
prefix = "ctrl+j"

help = "prefix+?"
detach = "prefix+d"
reload_config = "prefix+q"
settings = "prefix+shift+s"
open_notification_target = "prefix+shift+o"
goto = "prefix+g"
toggle_sidebar = "prefix+b"
edit_scrollback = "prefix+e"

new_workspace = "prefix+w"
workspace_picker = "prefix+s"
rename_workspace = "prefix+$"
close_workspace = "prefix+shift+k"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"

new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = "alt+1..9"
previous_tab = "shift+left"
next_tab = "shift+right"

# herdr names splits by the divider, the reverse of tmux -v/-h: horizontal splits downward.
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
close_pane = "prefix+x"
zoom = "prefix+z"
focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"
cycle_pane_next = "prefix+o"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+semicolon"
rename_pane = "prefix+comma"
resize_mode = "prefix+shift+z"
copy_mode = "prefix+["
