add_newline = true
command_timeout = 500

format = "$username$time$directory$dotnet$nodejs$git_branch$git_status$character"

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold fg:#e95678"
style_root = "bold fg:#e95678"

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time]($style) "
style = "fg:#59e3e3"

[directory]
truncation_length = 2
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold fg:#29d398"

[dotnet]
format = "[ $version]($style) "
style = "fg:#c4a7e7"

[nodejs]
format = "[ $version]($style) "
style = "fg:#26bbd9"

[git_branch]
format = "[ $branch]($style) "
style = "italic fg:#fadad1"
truncation_length = 25

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:#fab795"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇅${ahead_count}${behind_count} "
untracked = "?${count} "
stashed = "${count} "
modified = "${count} "
staged = "${count} "
renamed = "»${count} "
deleted = "✘${count} "

[character]
success_symbol = "[❯](bold fg:#c4a7e7)"
error_symbol = "[✗](bold fg:#e95678)"
