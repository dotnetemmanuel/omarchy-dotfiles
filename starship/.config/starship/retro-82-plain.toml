add_newline = true
command_timeout = 500

format = "$username$time$directory$dotnet$nodejs$git_branch$git_status$character"

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold fg:#f85525"
style_root = "bold fg:#f85525"

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time]($style) "
style = "fg:#8cbfb8"

[directory]
truncation_length = 2
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold fg:#028391"

[dotnet]
format = "[ $version]($style) "
style = "fg:#faa968"

[nodejs]
format = "[ $version]($style) "
style = "fg:#faa968"

[git_branch]
format = "[ $branch]($style) "
style = "italic fg:#f6dcac"
truncation_length = 25

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:#e97b3c"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇅${ahead_count}${behind_count} "
untracked = "?${count} "
stashed = "${count} "
modified = "${count} "
staged = "${count} "
renamed = "»${count} "
deleted = "✘${count} "

[character]
success_symbol = "[❯](bold fg:#faa968)"
error_symbol = "[✗](bold fg:#f85525)"
