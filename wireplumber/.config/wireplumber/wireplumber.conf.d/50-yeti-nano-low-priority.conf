## The Yeti Nano is a microphone: its analog output has no speakers, but ALSA
## gives USB outputs the highest session priority, so WirePlumber keeps picking
## it as the default sink. Push it below every real output.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Blue_Microphones_Yeti_Nano.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
